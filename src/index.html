<!DOCTYPE html>
<html lang="en">
  <head prefix="og: http://ogp.me/ns#">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A piano MIDI visualizer powered by Midy.">
    <title>@marmooo/piano-visualizer</title>
    <meta property="og:title" content="@marmooo/piano-visualizer">
    <meta property="og:site_name" content="@marmooo/piano-visualizer">
    <meta property="og:description" content="A piano MIDI visualizer powered by Midy.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://marmooo.github.io/piano-visualizer/">
    <meta property="og:image" content="https://marmooo.github.io/piano-visualizer/favicon/apple-touch-icon.png">
    <meta name="twitter:card" content="summary">
    <script>
      (function() {
        const saved = localStorage.getItem("darkMode");
        const prefersDark = globalThis.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = saved || (prefersDark ? "dark" : "light");
        document.documentElement.setAttribute("data-bs-theme", theme);
      })();
    </script>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-F2179JXDYY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-F2179JXDYY');
    </script>
    <link class="drop-inline-css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <style>
      #canvasContainer { width:100%; height:calc(100vh - 280px); position:relative; }
      .visualizerCanvas { position:absolute; width:100%; height:100%; pointer-events:none; }
      .backgroundLayer {
        position:absolute; top:0; left:0; width:100%; height:100%;
        object-fit:cover; object-position:center; pointer-events:none;
      }
      #controls { width:220px; }
      #controls h6 { cursor:grab; }
      #midi-player { height:34px; }
      #selectPanel.drag-active {
        border-color: var(--bs-warning) !important;
        background: color-mix(in srgb, var(--bs-warning) 8%, var(--bs-body-bg));
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--bs-warning) 18%, transparent);
      }
      #selectPanel.drag-active::after {
        content: "Drop a file here.";
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: inherit;
        background: color-mix(in srgb, var(--bs-body-bg) 75%, transparent);
        color: var(--bs-warning-text-emphasis);
        font-weight: 600;
        pointer-events: none;
      }

      .table-columns {
        position: relative;
      }
      .table-columns summary {
        cursor: pointer;
        user-select: none;
        list-style: none;
        padding: 0.375rem 0.75rem;
        border: 1px solid var(--bs-border-color);
        border-radius: var(--bs-border-radius);
        background: var(--bs-body-bg);
      }
      .table-columns summary::-webkit-details-marker {
        display: none;
      }
      .table-columns summary::after {
        content: " ▼";
        font-size: 0.75em;
      }
      .table-columns[open]
        summary::after {
        content: " ▲";
      }
      .table-columns ul {
        position: absolute;
        top: calc(100% + 4px);
        right: 0;
        min-width: 180px;
        margin: 0;
        padding: 8px;
        list-style: none;
        border: 1px solid var(--bs-border-color);
        border-radius: var(--bs-border-radius);
        background: var(--bs-body-bg);
        box-shadow: 0 4px 12px rgb(0 0 0 / 0.1);
        z-index: 1000;
      }
      .table-columns li + li {
        margin-top: 6px;
      }
      .table-columns-label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }

      html[data-bs-theme="dark"] .favicon { filter: invert(1) hue-rotate(180deg); }
    </style>
    <script data-ad-client="ca-pub-6459713332128733" async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand">
        <div class="container flex-wrap">
          <a class="navbar-brand" href="/piano-visualizer/">
            <img class="favicon" alt="" src="/piano-visualizer/favicon/favicon.svg" width="32" height="32">
            @marmooo/piano-visualizer
          </a>
          <div class="navbar-nav">
            <button title="toggle dark-mode" id="toggleDarkMode" class="fs-4 btn p-0 ms-1" type="button">🌓</button>
          </div>
        </div>
      </nav>
    </header>
    <main class="container">
      <p>A beautiful piano visualizer powered by <a href="https://github.com/marmooo/midy">Midy</a>.</p>
      <div id="selectPanel" class="card border-secondary-subtle border-dashed mt-3 mx-auto">
        <div class="card-body py-3 px-3 d-flex flex-wrap gap-2 align-items-center justify-content-center">
          <button id="selectFile" class="btn btn-primary rounded-pill">Select file</button>
          <input id="inputFile" type="file" accept=".mid,.midi,.sf2,.sf3,audio/*" hidden="">
          <button id="openLibrary" class="btn btn-outline-info rounded-pill" data-bs-toggle="modal" data-bs-target="#screenLibrary">🎼 Select from MIDI library</button>
          <button id="openSoundFontLibrary" class="btn btn-outline-success rounded-pill" data-bs-toggle="modal" data-bs-target="#soundFontLibraryModal">🎺 Select from SoundFont library</button>
        </div>
      </div>
      <div id="midi-player"></div>
      <div id="canvasContainer">
        <img id="backgroundImage" class="backgroundLayer" hidden>
        <video id="backgroundVideo" class="backgroundLayer" hidden loop muted autoplay playsinline></video>
        <canvas id="mainCanvas" class="visualizerCanvas"></canvas>
        <canvas id="particleCanvas" class="visualizerCanvas"></canvas>
        <canvas id="keyboardCanvas" class="visualizerCanvas"></canvas>
        <canvas id="lineCanvas" class="visualizerCanvas"></canvas>
        <nav id="controls" class="position-absolute p-3 rounded-3 shadow bg-body-tertiary">
          <h6>Configuration</h6>
          <details>
            <summary>Global</summary>
            <label class="d-block">Speed:
              <input class="form-range" type="range" id="speedFactor" min="0.1" max="3" step="0.05" value="1">
            </label>
            <label class="d-block">Scroll Distance Factor:
              <input class="form-range" type="range" id="scrollDistanceFactor" min="0.1" max="3" step="0.05" value="1">
            </label>
            <label class="d-block">Start Delay:
              <input class="form-range" type="range" id="startDelay" min="0.1" max="3" step="0.1" value="2">
            </label>

            <div class="pb-3">
              <select class="form-select form-select-sm d-inline-block" id="backgroundPreset">
                <option value="">Background: None</option>
                <option value="./data/nasa-blue-marble.webp">Image 1: NASA Blue Marble</option>
                <option value="./data/nasa-galaxy.webp">Image 2: NASA Galaxy</option>
                <option value="./data/nasa-drift-ice.webp">Image 3: NASA Drift Ice</option>
                <option value="./data/japan-river.webp">Image 4: Japan River</option>
                <option value="./data/japan-lake.webp">Image 5: Japan Lake</option>
                <option value="./data/japan-sky.webp">Image 6: Japan Sky</option>
                <option value="./data/japan-mountain.webp">Image 7: Japan Mountain</option>
                <option value="./data/japan-pagoda.webp">Image 8: Japan Pagoda</option>
                <option value="./data/japan-cave.webp">Image 9: Japan Cave</option>
                <option value="./data/japan-shrine.webp">Image 10: Japan Shrine</option>
                <option value="./data/fantasy-forest.webp">Image 11: Fantasy Forest</option>
                <option value="./data/fantasy-lake.webp">Image 12: Fantasy Lake</option>
                <option value="./data/fantasy-sea.webp">Image 13: Fantasy Sea</option>
                <option value="./data/fantasy-flare.webp">Image 14: Fantasy Flare</option>
                <option value="./data/cyber-space.webp">Image 15: Cyber Space</option>
                <option value="./data/cyber-network.webp">Image 16: Cyber Network</option>
                <option value="./data/cyber-magic.webp">Image 17: Cyber Magic</option>
                <option value="./data/movie-earth.webm">Move 1: Earth</option>
                <option value="./data/movie-matrix-code.webm">Movie 2: Matrix Code</option>
                <option value="./data/movie-number-stream.webm">Movie 3: Number Stream</option>
                <option value="./data/movie-water.webm">Movie 4: Water</option>
                <option value="custom">Custom file...</option>
              </select>
              <input class="form-control form-control-sm d-inline-block" type="file" id="backgroundFile" accept="image/*,video/*">
            </div>
          </details>
          <details>
            <summary>Layout</summary>
            <label class="d-block">
              <select class="form-select form-select-sm d-inline-block w-auto" id="noteDirection">
                <option value="down">⬇</option>
                <option value="up">⬆</option>
                <option value="left">⬅</option>
                <option value="right">➡</option>
              </select>
              Note Direction
            </label>
            <label class="d-block">
              <select class="form-select form-select-sm d-inline-block w-auto" id="showPiano">
                <option value="piano">Piano</option>
                <option value="line">Line</option>
                <option value="none">None</option>
              </select>
              Piano / Line
            </label>
            <label class="d-block">Piano / Line Position:
              <input class="form-range" type="range" id="effects.pianoPosition" min="0" max="1" step="0.05" value="0">
            </label>
          </details>
          <details>
            <summary>Colors</summary>
            <div id="channelColorPickers" class="d-flex flex-wrap gap-2 pt-1 pb-3"></div>
          </details>
          <details>
            <summary>Piano</summary>
            <label class="d-block">Opacity:
              <input class="form-range" type="range" id="keyboardOptions.opacity" min="0" max="1" step="0.05" value="1">
            </label>
            <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="keyboardOptions.gradientEffect">Gradient</label>
            <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="keyboardOptions.pressEffect" checked>Press</label>
            <label class="d-block">Key Aspect Ratio (H / W):
              <input class="form-range" type="range" id="keyboardOptions.keyAspectRatio" min="1" max="8" step="0.1" value="4">
            </label>
          </details>
          <details>
            <summary>Line</summary>
            <label class="d-block">Opacity:
              <input class="form-range" type="range" id="lineOptions.opacity" min="0" max="1" step="0.05" value="1">
            </label>
            <label class="d-block">Color:
              <input type="color" id="lineOptions.color" value="#888888" class="form-control form-control-color d-inline-block">
            </label>
          </details>
          <details>
            <summary>Note</summary>
            <label class="d-block">Thickness:
              <input class="form-range" type="range" id="noteOptions.thickness" min="0.1" max="2" step="0.05" value="0.7">
            </label>
            <label class="d-block">Opacity:
              <input class="form-range" type="range" id="noteOpacity" min="0" max="1" step="0.05" value="1">
            </label>
            <label class="d-block">
              <select class="form-select form-select-sm d-inline-block w-auto" id="noteOptions.drawMethod">
                <option value="roundRect">Round</option>
                <option value="fillRect">Square</option>
              </select>
              Corner
            </label>
            <label class="form-check d-block">
              <input class="form-check-input" type="checkbox" id="noteOptions.strokeOnly">
              Stroke Only
            </label>
            <label class="d-block">
              <select class="form-select form-select-sm d-inline-block w-auto" id="noteOptions.strokeDash">
                <option value="none">None</option>
                <option value="dotted">Dotted</option>
                <option value="dashed">Dashed</option>
              </select>
              Stroke Dash
            </label>
            <label class="d-block">Stroke Width:
              <input class="form-range" type="range" id="noteOptions.strokeWidth" min="1" max="10" step="0.5" value="2">
            </label>
          </details>
          <details>
            <summary>Fog</summary>
            <div class="d-flex flex-wrap gap-1 pb-1">
              <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="fog.top">Top</label>
              <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="fog.bottom">Bottom</label>
              <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="fog.left">Left</label>
              <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="fog.right">Right</label>
              <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="fog.pianoNear">Piano Near</label>
              <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="fog.pianoFar">Piano Far</label>
            </div>
            <label class="d-block">Color:
              <input type="color" id="fogOptions.color" value="#000000" class="form-control form-control-color d-inline-block">
            </label>
            <label class="d-block">Opacity:
              <input class="form-range" type="range" id="fogOptions.opacity" min="0" max="1" step="0.05" value="0.85">
            </label>
            <label class="d-block">Size:
              <input class="form-range" type="range" id="fogOptions.size" min="0.05" max="0.6" step="0.01" value="0.25">
            </label>
          </details>
          <details>
            <summary>Effects</summary>
            <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="effects.glow">Glow (cost++)</label>
            <label class="d-block">
              <select class="form-select form-select-sm d-inline-block w-auto" id="particleOptions.type">
                <option value="none">None</option>
                <option value="burst" selected>Burst</option>
                <option value="spark">Spark</option>
                <option value="steam">Steam</option>
                <option value="electric">Electric</option>
                <option value="fire">Fire</option>
                <option value="star">Star</option>
                <option value="bubble">Bubble</option>
                <option value="confetti">Confetti</option>
              </select>
              Particle
            </label>
            <hr>
            <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="noteOptions.fadeEffect">Fade</label>
            <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="effects.bounce">Bounce</label>
            <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="effects.ignite">Ignite</label>
          </details>
          <details>
            <summary>Record</summary>
            <button id="recordBtn" type="button" class="btn btn-sm btn-danger mb-2 w-100">
              ⏺ Start
            </button>
            <label class="d-block">FPS:
              <select class="form-select form-select-sm" id="recordFps">
                <option value="15">15</option>
                <option value="24">24</option>
                <option value="30" selected>30</option>
                <option value="60">60</option>
              </select>
            </label>
            <label class="d-block">Quality:
              <select class="form-select form-select-sm" id="recordQuality">
                <option value="2000000">Low (2 Mbps)</option>
                <option value="5000000">Medium (5 Mbps)</option>
                <option value="8000000" selected>High (8 Mbps)</option>
                <option value="15000000">Very High (15 Mbps)</option>
              </select>
            </label>
            <label class="d-block">Resolution:
              <select class="form-select form-select-sm" id="recordResolution">
                <option value="1" selected>Display (1×)</option>
                <option value="1.5">1.5×</option>
                <option value="2">2× (Retina)</option>
                <option value="720">720p height</option>
                <option value="1080">1080p height</option>
              </select>
            </label>
          </details>
        </nav>
      </div>
    </main>
    <footer class="pt-4 alert text-center">
      <div>
        <a class="px-1" href="/">Home</a>
        <a class="px-1" href="/terms/">Terms</a>
        <a class="px-1" href="https://github.com/marmooo/piano-visualizer">Contact</a>
      </div>
      <div class="text-muted">&copy; <a href="https://github.com/marmooo">marmooo</a></div>
    </footer>
    <!-- MIDI library (Bootstrap modal) -->
    <div class="modal" id="screenLibrary" tabindex="-1" aria-labelledby="screenLibraryLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title fw-bold text-warning-emphasis" id="screenLibraryLabel">🎼 MIDI ライブラリ</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div id="libraryCollections" class="d-flex flex-wrap gap-1 mb-2 d-none"></div>
            <div id="libraryInstruments" class="d-flex flex-wrap gap-1 mb-2 d-none"></div>
            <div class="toolbar d-flex justify-content-end align-items-center gap-2">
              <div>Powered by <a href="https://marmooo.github.io/free-midi/">Free MIDI</a></div>
              <div id="libraryColumns"></div>
            </div>
            <div class="table-responsive text-nowrap">
              <table id="libraryTable" class="table table-striped table-hover table-bordered table-sm align-middle w-100">
                <thead><!-- drop-inline-css !-->
                  <tr><th></th></tr>
                  <tr><td></td></tr>
                </thead>
                <tbody>
                  <tr><th></th></tr>
                  <tr><td></td></tr>
                </tbody>
              </table>
            </div>
            <div id="libraryPagination" class="d-flex justify-content-center"></div>
          </div>
        </div>
      </div>
    </div><!-- /screenLibrary -->
    <!-- SoundFont library (Bootstrap modal) -->
    <div class="modal" id="soundFontLibraryModal" tabindex="-1" aria-labelledby="soundFontLibraryModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title fw-bold text-warning-emphasis" id="soundFontLibraryModalLabel">🎺 SoundFont ライブラリ</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="soundFontLibraryList" class="d-flex flex-column gap-1">読込中…</form>
          </div>
        </div>
      </div>
    </div><!-- /soundFontLibraryModal -->
    <div class="drop-inline-css
      btn bg-light-subtle p-1 form-range
      form-check form-check-label
      d-flex flex-column align-items-center small
      modal-backdrop show gap-1
      form-control form-control-sm is-invalid
      pagination page-item page-link active
      form-check form-check-label
      form-select form-select-sm p-1 border border-secondary
      list-group shadow-sm list-group-item py-1 px-2
      d-none">
      <input class="form-check-input" type="radio">
    </div>
    <script type="module" src="/piano-visualizer/index.js"></script>
  </body>
</html>
